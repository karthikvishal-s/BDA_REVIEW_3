# Read by spark-submit, spark-shell and pyspark inside the container.
spark.master                      local[*]
spark.driver.memory               5g
spark.sql.shuffle.partitions      64
spark.sql.session.timeZone        UTC

# Event log keeps the DAG / stage evidence after the job exits (history server on :18080).
spark.eventLog.enabled            true
spark.eventLog.dir                file:///work/outputs/spark-events
spark.history.fs.logDirectory     file:///work/outputs/spark-events
